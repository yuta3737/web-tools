<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="MoneyTools">
  <rect width="64" height="64" rx="14" fill="#1a56db"/>
  <!-- 右肩上がりの折れ線。16px でも形が潰れないよう太め・頂点4つに絞っている -->
